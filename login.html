
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JD Poultry Farm | Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #183b2b;
            padding: 20px;
        }

        .login-box {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px #10291e;
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            color: #183b2b;
            margin-bottom: 8px;
        }

        .logo p {
            color: #777;
        }

        label {
            display: block;
            margin: 17px 0 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #183b2b;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #286344;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            color: #b00020;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        <h1>JD POULTRY FARM</h1>
        <p>Administrator Login</p>
    </div>

    <form id="loginForm">

        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            placeholder="Enter admin username"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
        >

        <button type="submit">Login</button>

        <p id="message"></p>

    </form>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit",
    async function(event) {
        event.preventDefault();

        const username =
            document.getElementById("username").value;

        const password =
            document.getElementById("password").value;

        const message =
            document.getElementById("message");

        message.textContent = "Checking login...";

        try {
            const response = await fetch("/api/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ username, password })
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.message || "Login failed");
            }

            window.location.href = "/admin.html";

        } catch (error) {
            message.textContent =
                error.message || "Could not connect to server.";
        }
    }
);
</script>

</body>
</html>
